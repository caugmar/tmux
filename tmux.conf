# ==========================================
# TMUX CONFIGURATION (ZELLIJ-STYLE)
# ==========================================

# --- Interface e Visual ---
set -g status-position top
set -g status-style 'bg=#1e1e2e fg=#cdd6f4'
set -g status-left '#[bg=#89b4fa,fg=#181825,bold]  #S #[bg=#1e1e2e,fg=#89b4fa] '
set -g status-right '#[fg=#fab387]󱫋 #[fg=#cdd6f4]%H:%M #[fg=#a6adc8]| #[fg=#94e2d5]  #H '

# Estilo das Janelas (Abas)
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[bg=#fab387,fg=#181825,bold] #I:#W #[default]'

# Títulos nos Painéis (Pane Frames)
set -g pane-border-status top
set -g pane-border-format " [ ###I: #P ] "
set -g pane-border-style "fg=#585b70"

# --- Atalhos Sem Prefixo (Alt/Meta) ---

# Navegação entre painéis: Alt + Setas
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Divisão de tela: Alt + h (horizontal) e Alt + v (vertical)
bind -n M-h split-window -h -c "#{pane_current_path}"
bind -n M-v split-window -v -c "#{pane_current_path}"

# Gerenciamento de Janelas (Abas)
bind -n M-n new-window -c "#{pane_current_path}"
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# Redimensionar painéis: Alt + Shift + Setas
bind -n M-S-Left resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up resize-pane -U 5
bind -n M-S-Down resize-pane -D 5

# Fechar painel: Alt + q
bind -n M-q kill-pane

# --- Configurações Gerais ---

set -g mouse on               # Habilita suporte ao mouse
set -s escape-time 0          # Resposta instantânea para o Esc
set -g base-index 1           # Inicia contagem de janelas em 1
setw -g pane-base-index 1     # Inicia contagem de painéis em 1
set -g renumber-windows on    # Reorganiza números ao fechar abas
set -g default-terminal "screen-256color" # Garante suporte a cores

